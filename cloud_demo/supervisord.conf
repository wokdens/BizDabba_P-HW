[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_RESOLUTION)s -nocursor
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:fluxbox]
command=fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.err

[program:x11vnc]
command=x11vnc -display %(ENV_DISPLAY)s -nopw -listen localhost -xkb -ncache 10 -forever -shared -bg
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:websockify]
command=websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err

[program:bizdabba]
directory=/app
command=python3 app.py
environment=DISPLAY="%(ENV_DISPLAY)s",PYTHONUNBUFFERED="1"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/bizdabba.log
stderr_logfile=/var/log/supervisor/bizdabba.err
