[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=Xvfb :0 -screen 0 1280x800x24 -nocursor
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":0"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.err

[program:x11vnc]
command=x11vnc -display :0 -nopw -listen 0.0.0.0 -xkb -ncache 10 -forever -shared
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:websockify]
command=websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err

[program:bizdabba]
directory=/app
command=python3 app.py
environment=DISPLAY=":0",PYTHONUNBUFFERED="1"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/bizdabba.log
stderr_logfile=/var/log/supervisor/bizdabba.err
